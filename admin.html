<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h3 { color: #2563eb; margin: 0 0 20px 0; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size: 16px; margin-bottom: 10px; }
        .btn-gen { background: #2563eb; }
        .btn-copy { background: #16a34a; display: none; }
        .result { background: #eef2ff; padding: 10px; border-radius: 6px; word-break: break-all; font-size: 12px; display: none; color: #333; margin-bottom: 10px; border: 1px dashed #2563eb; }
    </style>
</head>
<body>

    <div class="card">
        <h3>⚡ লিংক মেকার</h3>
        <input type="text" id="driveUrl" placeholder="এখানে আসল ফাইল লিংক দিন...">
        <button class="btn-gen" onclick="makeLink()">লিংক তৈরি করুন</button>
        
        <div class="result" id="output"></div>
        <button id="copyBtn" class="btn-copy" onclick="copyLink()">📋 কপি করুন</button>
    </div>

    <script>
        const HOST_URL = "https://file-download1.github.io/fast/";

        function makeLink() {
            const drive = document.getElementById('driveUrl').value.trim();
            if(!drive) { alert("দয়া করে লিংক দিন!"); return; }

            const encoded = btoa(drive);
            const final = `${HOST_URL}?link=${encoded}`;

            const out = document.getElementById('output');
            out.innerText = final;
            out.style.display = 'block';
            
            document.getElementById('copyBtn').style.display = 'block';
        }

        function copyLink() {
            navigator.clipboard.writeText(document.getElementById('output').innerText);
            const btn = document.getElementById('copyBtn');
            btn.innerText = "✅ কপি হয়েছে!";
            setTimeout(() => btn.innerText = "📋 কপি করুন", 2000);
        }
    </script>
</body>
</html>
